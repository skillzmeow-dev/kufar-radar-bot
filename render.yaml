services:
  - type: web
    name: kufar-radar-bot
    env: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "1462879969"
      - key: CHANNEL_USERNAME
        value: "@minsk_rent_live"
      - key: POLL_INTERVAL
        value: "25"
      - key: PYTHON_VERSION
        value: "3.11.9"
